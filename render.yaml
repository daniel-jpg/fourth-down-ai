# Optional zero-compute-fee experiment, not a production hosting guarantee.
# Owner explicitly declined paid instance; never auto-promote to one.
# Free plans may have bandwidth/build-minute overage charges if payment
# method exists, and their 750 hours/month are shared with other services.
services:
  - type: web
    name: fourth-down-ai-verified
    runtime: docker
    repo: https://github.com/daniel-jpg/fourth-down-ai
    branch: main
    region: oregon
    # Free: 0.1 CPU / 512 MB, NOT previously verified for this ML app.
    # Failure is acceptable; never increase the plan without approval.
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    # A new model/research commit must never auto-publish.
    autoDeployTrigger: "off"
