name: Frozen 2027 policy synthetic integration

# A fabricated-only smoke test. Never download NFL football outcomes,
# evaluate 2027 real games, run protected 2026 validation or promote models.
on:
  push:
    branches: [main]
    paths:
      - "src/frozen_2027_policy_bridge.py"
      - "tests/test_frozen_2027_policy_bridge.py"
      - "data/historical_nuisance_2014_2025_development_parameters.json"
      - ".github/workflows/frozen_2027_synthetic_policy_bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-policy-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Check real pinned engine parity and fabricated input safety
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest -v tests/test_frozen_2027_policy_bridge.py 2>&1 | tee frozen-2027-synthetic-policy-bridge-log.txt
      - name: Save research-only synthetic tests (NO real outcomes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-2027-policy-synthetic-only-audit
          path: frozen-2027-synthetic-policy-bridge-log.txt
          retention-days: 14
