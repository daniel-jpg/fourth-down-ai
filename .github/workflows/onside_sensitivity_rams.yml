name: Experimental Rams onside sensitivity

on:
  push:
    branches: [main]
    paths:
      - "src/75_rams_onside_sensitivity_audit.py"
      - "src/kickoff_2025_onside_sensitivity.py"
      - "tests/test_onside_2025_preview.py"
      - ".github/workflows/onside_sensitivity_rams.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify optional onside branches, zero-parity and production isolation
        run: |
          python -m pytest -q tests/test_kickoff_onside_sensitivity.py tests/test_onside_2025_preview.py

      - name: Compare explicit onside assumptions on the Rams situation
        run: |
          set -o pipefail
          python src/75_rams_onside_sensitivity_audit.py 2>&1 | tee onside-sensitive-rams.log

      - name: Check strictly research-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("artifacts/75_rams_onside_what_if.json").read_text())
          assert report["data_season"]==2025
          assert report["2026_outcomes_read"] is False
          assert report["on_side_recovery_records"]==4
          assert report["onside_matched_records"]==37
          assert len(report["rows"])==8
          assert report["rows"][0]["p_attempt_assumed"]==0
          assert "experiment only" in report["model_status"]
          PY
          git diff --exit-code -- models/win_probability_model.joblib
          git diff --exit-code -- src/42_build_decision_engine.py
          git diff --exit-code -- app.py

      - name: Upload exploratory sensitivity comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2025-rams-onside-sensitivity-research-only
          path: |
            artifacts/75_rams_onside_what_if.json
            onside-sensitive-rams.log
          if-no-files-found: warn
          retention-days: 30
