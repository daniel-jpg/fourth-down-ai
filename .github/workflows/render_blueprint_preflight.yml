name: Validate optional Render Blueprint

# Validates configuration only; does not deploy or incur hosting charges.
on:
  push:
    branches: [main]
    paths:
      - render.yaml
      - Dockerfile
      - .dockerignore
      - .github/workflows/render_blueprint_preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse Render YAML and enforce deployment safety
        run: |
          python -m pip install --disable-pip-version-check pyyaml==6.0.3
          python - <<'PY'
          from pathlib import Path
          import yaml
          obj = yaml.safe_load(Path("render.yaml").read_text())
          assert set(obj) == {"services"}
          assert len(obj["services"]) == 1
          svc = obj["services"][0]
          assert svc["type"] == "web" and svc["runtime"] == "docker"
          assert svc["repo"] == "https://github.com/daniel-jpg/fourth-down-ai"
          assert svc["branch"] == "main"
          assert svc["plan"] == "free", (
              "Paid Render instance not authorized; stop before creating charges"
          )
          assert svc["numInstances"] == 1
          assert svc["region"] == "oregon"
          assert svc["healthCheckPath"] == "/_stcore/health"
          assert svc["dockerfilePath"] == "./Dockerfile"
          assert svc["dockerContext"] == "."
          assert svc["autoDeployTrigger"] == "off"
          assert "envVars" not in svc and "disk" not in svc
          docker = Path("Dockerfile").read_text()
          ignore = Path(".dockerignore").read_text()
          assert "USER appuser" in docker and "HEALTHCHECK " in docker
          assert "--server.address=0.0.0.0" in docker
          assert "--server.port=$PORT" in docker
          for excluded in (".env", "**/secrets.toml", "reports", "scripts", "tests"):
              assert excluded in ignore, excluded
          for required in (
              "!models/fake_conversion_model.joblib",
              "!models/field_goal_outcome_model.joblib",
              "!models/punt_field_position_model.joblib",
              "!models/win_probability_model.joblib",
              "!data/fg_weather_2014_2024_research_only.json",
          ):
              assert required in ignore, required
          print("PASS: optional owner-authorized Render Docker config is valid")
          print("NO service created, NO charges authorized, NO frozen model changes")
          PY
      - name: Ensure frozen artifacts were never rewritten
        run: |
          git diff --exit-code -- app.py models/ data/ src/42_build_decision_engine.py
