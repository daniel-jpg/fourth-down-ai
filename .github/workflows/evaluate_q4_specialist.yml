name: Evaluate Q4 last-five-minute WP specialist

on:
  push:
    branches: [main]
    paths:
      - "src/71_evaluate_q4_specialist.py"
      - "src/67_train_modern_wp_candidate.py"
      - "tests/test_q4_specialist.py"
      - ".github/workflows/evaluate_q4_specialist.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Q4 model guard tests
        run: python -m pytest -q tests/test_q4_specialist.py
      - name: Train and evaluate fixed candidate
        run: |
          set -o pipefail
          python src/71_evaluate_q4_specialist.py 2>&1 | tee q4-specialist-audit.log
      - name: Archive the research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q4-specialist-not-production
          path: |
            q4-specialist-audit.log
            artifacts/q4_last_five_wp_candidate_report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Confirm production was not edited
        run: |
          git diff --exit-code -- models/win_probability_model.joblib
          git diff --exit-code -- src/42_build_decision_engine.py
          git diff --exit-code -- app.py
