name: Evaluate frozen field-goal calibration candidate

on:
  push:
    branches: [main]
    paths:
      - "src/70_evaluate_fg_platt_candidate.py"
      - "tests/test_fg_platt_candidate.py"
      - ".github/workflows/evaluate_fg_platt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fg-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out frozen model/data
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify monotonic and leakage-safe candidate
        run: |
          python -m pytest -q tests/test_fg_platt_candidate.py tests/test_event_model_2025_audit.py

      - name: Evaluate fixed calibration on 2024 and 2025
        run: |
          set -o pipefail
          python src/70_evaluate_fg_platt_candidate.py 2>&1 | tee fg-calibration-audit.log

      - name: Archive audit-only model candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-only-fg-calibration
          path: |
            fg-calibration-audit.log
            artifacts/2025_fg_platt_candidate_report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Confirm production models remain frozen
        run: |
          git diff --exit-code -- models/field_goal_outcome_model.joblib
          git diff --exit-code -- src/42_build_decision_engine.py
          git diff --exit-code -- app.py
