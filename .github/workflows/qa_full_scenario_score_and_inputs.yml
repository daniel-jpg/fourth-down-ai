name: Audit all Fourth Down AI inputs and full scoreboards

on:
  push:
    branches: [main]
    paths:
      - scripts/qa_full_scenario_score_and_inputs.py
      - .github/workflows/qa_full_scenario_score_and_inputs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-presnap-score-and-factors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install existing pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Reproduce original frozen 36-case model numbers
        run: PYTHONPATH=. python scripts/qa_final_new_game_scenarios.py > qa-original-36-cases.log
      - name: Verify actual vs synthetic scores, all inputs and score impact
        run: |
          PYTHONPATH=. python scripts/qa_full_scenario_score_and_inputs.py | tee qa-full-input-audit.log
      - name: Preserve complete full-factor case audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fourth-down-full-scores-and-all-inputs
          path: |
            qa-original-36-cases.log
            qa-full-input-audit.log
            artifacts/final_new_scenario_stress_2026_10.json
            artifacts/final_full_input_score_audit.json
            artifacts/final_full_input_score_audit.md
          if-no-files-found: ignore
          retention-days: 21
