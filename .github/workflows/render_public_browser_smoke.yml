name: Verify public Render Q4, weather and repeated edits in Chromium

# Render's free service deliberately uses manual deployments.
# Do not test app pushes against older live deployments. Verify the live
# service on manual dispatch or a deliberate edit to this QA workflow,
# after the matching application code has been deployed to Render.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/render_public_browser_smoke.yml
  workflow_dispatch:
    inputs:
      public_base_url:
        description: "Actual deployed HTTPS URL (https://<name>.onrender.com)"
        required: false
        default: "https://fourth-down-ai-nfl.onrender.com"
        type: string

permissions:
  contents: read

concurrency:
  group: fourth-down-render-public-browser
  cancel-in-progress: false

jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject non-public or non-Render URLs
        id: target
        env:
          PUBLIC_URL: ${{ inputs.public_base_url || 'https://fourth-down-ai-nfl.onrender.com' }}
        run: |
          python - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit
          raw = os.environ["PUBLIC_URL"].strip().rstrip("/")
          url = urlsplit(raw)
          assert url.scheme == "https", "HTTPS required"
          assert re.fullmatch(r"[a-z0-9-]+\.onrender\.com", url.hostname or ""), (
              "Only onrender.com public subdomains are permitted"
          )
          assert url.port is None and url.username is None
          assert not url.path and not url.query and not url.fragment
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("url=" + raw + "\n")
          print("PASS: public HTTPS Render URL", url.hostname)
          PY

      - name: Probe Render public DNS and health before browser
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: |
          python - <<'PY'
          import os
          import socket
          import time
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          base = os.environ["TARGET_URL"]
          hostname = urlsplit(base).hostname
          assert hostname
          addresses = sorted({
              item[4][0] for item in socket.getaddrinfo(
                  hostname, 443, type=socket.SOCK_STREAM
              )
          })
          print("PUBLIC_RENDER_DNS", hostname, addresses, flush=True)
          for route in ("/_stcore/health", "/"):
              last_error = ""
              for attempt in range(1, 4):
                  try:
                      request = Request(
                          base + route,
                          headers={"User-Agent": "FourthDownAI-CI-health/1.0"},
                      )
                      with urlopen(request, timeout=30) as response:
                          body = response.read(1024)
                          print(
                              "PUBLIC_RENDER_HTTP", route, response.status,
                              response.headers.get("Content-Type"),
                              "bytes_sampled", len(body),
                              "attempt", attempt, flush=True,
                          )
                          assert response.status == 200
                      break
                  except Exception as error:
                      last_error = type(error).__name__ + ": " + str(error)
                      print("PUBLIC_RENDER_HTTP_RETRY", route, attempt,
                            last_error[:300], flush=True)
                      if attempt < 3:
                          time.sleep(6)
              else:
                  raise RuntimeError(
                      "Public Render endpoint failed " + route + ": " +
                      last_error
                  )
          PY

      - name: Install Chromium browser driver
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Verify public source and weather UI match tested GitHub
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: |
          EXPECTED_SHA="$(python -m src.deployment_source_fingerprint)"
          export EXPECTED_SHA
          python - <<'PY'
          import os
          import time
          from playwright.sync_api import sync_playwright
          expected = os.environ["EXPECTED_SHA"]
          with sync_playwright() as driver:
              browser = driver.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 900})
              try:
                  nav = page.goto(
                      os.environ["TARGET_URL"],
                      wait_until="domcontentloaded", timeout=60000,
                  )
                  print(
                      "PUBLIC_RENDER_CHROMIUM_INITIAL",
                      "status", nav.status if nav else None,
                      "url", page.url,
                      "title", page.title(),
                      "frames", len(page.frames), flush=True,
                  )
                  # Streamlit initializes through an asynchronous WebSocket.
                  # Reloading every 10 seconds on Render Free repeatedly aborts
                  # slow initialization and can leave Chromium on a blank page.
                  # Wait on one connected page, with at most one recovery reload.
                  page.on(
                      "pageerror",
                      lambda error: print(
                          "PUBLIC_RENDER_JS_ERROR", str(error)[:400],
                          flush=True,
                      ),
                  )
                  start = time.monotonic()
                  deadline = start + 420
                  last_progress = 0
                  refreshed_once = False
                  found = None
                  weather_ui = False
                  while time.monotonic() < deadline:
                      for frame in page.frames:
                          try:
                              marker = frame.locator(
                                  "#fourth-down-runtime-source"
                              )
                              if marker.count():
                                  found = marker.first.get_attribute(
                                      "data-source-sha256"
                                  )
                                  weather_ui = (
                                      frame.get_by_role(
                                          "spinbutton", name="Temperature (°F)",
                                      ).count() == 1
                                      and frame.get_by_role(
                                          "spinbutton", name="Wind speed (mph)",
                                      ).count() == 1
                                      and frame.get_by_text(
                                          "Weather observations (optional)",
                                          exact=True,
                                      ).count() == 0
                                  )
                                  break
                          except Exception:
                              pass
                      if found == expected and weather_ui:
                          break
                      elapsed = time.monotonic() - start
                      if elapsed - last_progress >= 30:
                          last_progress = elapsed
                          print(
                              "PUBLIC_RENDER_BROWSER_WAIT",
                              "seconds", round(elapsed),
                              "marker", (found or "missing")[:12],
                              "weather_ui", weather_ui,
                              "frames", len(page.frames),
                              "url", page.url,
                              flush=True,
                          )
                      # One refresh is allowed only after giving the
                      # app three full minutes to initialize normally.
                      if elapsed >= 180 and not refreshed_once and found is None:
                          refreshed_once = True
                          print("PUBLIC_RENDER_ONE_RECOVERY_RELOAD", flush=True)
                          page.reload(
                              wait_until="domcontentloaded", timeout=60000
                          )
                      page.wait_for_timeout(3000)
                  if found is None:
                      print(
                          "PUBLIC_RENDER_CHROMIUM_NO_MARKER",
                          "url", page.url, "title", page.title(),
                          "frames", len(page.frames),
                          "body_chars", len(page.locator("body").inner_text(
                              timeout=15000
                          )),
                          flush=True,
                      )
                  assert found is not None, "No hosted app/source marker"
                  assert len(found) == 64
                  assert found == expected, (
                      "Hosted source " + found[:12] +
                      " differs from tested GitHub " + expected[:12]
                  )
                  assert weather_ui, "Expected live weather UI not found"
                  print(
                      "PUBLIC_RENDER_SOURCE_AND_WEATHER_PASS",
                      found[:12], flush=True,
                  )
              finally:
                  try:
                      page.screenshot(
                          path="render-public-source.png", full_page=True
                      )
                  except Exception:
                      pass
                  browser.close()
          PY

      - name: Confirm hosted HOME Q4 recommendation and corrected kickoff
        env:
          FOURTH_DOWN_SMOKE_BASE_URL: ${{ steps.target.outputs.url }}
          FOURTH_DOWN_ANALYZE_TIMEOUT_SECONDS: '240'
        run: python scripts/qa_local_streamlit_home_browser.py

      - name: Confirm hosted weather isolation, METAR rejection and roof
        env:
          FOURTH_DOWN_SMOKE_BASE_URL: ${{ steps.target.outputs.url }}
          FOURTH_DOWN_WEATHER_TIMEOUT_SECONDS: '180'
        run: python scripts/qa_weather_streamlit_browser.py

      - name: Confirm repeated edits leave public app responsive and undimmed
        env:
          FOURTH_DOWN_SMOKE_BASE_URL: ${{ steps.target.outputs.url }}
          FOURTH_DOWN_WEATHER_TIMEOUT_SECONDS: '240'
        run: python scripts/qa_repeated_input_browser.py

      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-public-q4-weather-browser
          path: |
            render-public-source.png
            local-streamlit-q4-home.png
            docker-streamlit-weather-qa.png
            repeated-input-no-dimming.png
          if-no-files-found: ignore
          retention-days: 7
