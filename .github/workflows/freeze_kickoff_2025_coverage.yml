name: Freeze 2025 kickoff coverage and unsupported outcomes

on:
  push:
    branches: [main]
    paths:
      - "src/73_audit_2025_kickoff_coverage.py"
      - "tests/test_kickoff_2025_coverage.py"
      - ".github/workflows/freeze_kickoff_2025_coverage.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: freeze-2025-kickoff-coverage
  cancel-in-progress: false

jobs:
  audit:
    name: Verify all 2025 Q4 kickoff exclusions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project and frozen empirical 2025 donors
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test event taxonomy and leakage guards
        run: python -m pytest -q tests/test_kickoff_2025_coverage.py

      - name: Freeze actual uncovered kickoff categories from 2025
        run: |
          set -o pipefail
          python src/73_audit_2025_kickoff_coverage.py 2>&1 | tee kickoff-coverage-audit.log

      - name: Verify generated report and regression suite
        run: |
          python -m pytest -q
          python -c 'import json; from pathlib import Path; d=json.loads(Path("data/kickoff_2025_q4_coverage.json").read_text()); a=d["groups"][0]; assert a["counts"]["modeled_ordinary"]==488; assert sum(a["counts"].values())==a["total_kickoffs"]; assert a["total_kickoffs"]>=488; assert d["no_2026_outcomes"]'

      - name: Publish verified historical coverage evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/kickoff_2025_q4_coverage.json
          if git diff --cached --quiet; then
            echo "Historical coverage report unchanged."
          else
            git diff --cached --check
            git commit -m "Freeze observed 2025 Q4 kickoff coverage and excluded outcomes"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload audit output, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2025-q4-kickoff-coverage-audit
          path: |
            kickoff-coverage-audit.log
            data/kickoff_2025_q4_coverage.json
          if-no-files-found: warn
          retention-days: 30
