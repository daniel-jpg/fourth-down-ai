name: Experimental constrained WP benchmark

on:
  push:
    branches: [main]
    paths:
      - "src/wp_monotonic_candidate.py"
      - "src/67_train_modern_wp_candidate.py"
      - ".github/workflows/train_wp_candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-benchmark:
    name: Train and benchmark frozen candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Train fixed candidate and compare chronological 2024/2025
        run: |
          set -o pipefail
          python src/67_train_modern_wp_candidate.py 2>&1 | tee wp-training-log.txt

      - name: Archive experimental model and evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constrained-wp-development-only
          path: |
            wp-training-log.txt
            artifacts/wp_regulation_candidate.joblib
            artifacts/wp_candidate_development_report.json
          if-no-files-found: warn
          retention-days: 14
