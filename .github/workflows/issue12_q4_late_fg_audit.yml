name: Issue 12 read-only Q4 near-expiry FG audit

on:
  push:
    branches: [main]
    paths:
      - scripts/audit_issue12_q4_late_fg.py
      - tests/test_issue12_q4_late_fg.py
      - .github/workflows/issue12_q4_late_fg_audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Validate diagnostics without retraining
        run: |
          python -m pytest -q tests/test_issue12_q4_late_fg.py
          PYTHONPATH=. python scripts/audit_issue12_q4_late_fg.py | tee issue12-diagnostic.log
      - name: Upload reproducible diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue12-q4-fg-readonly-diagnostic
          path: |
            artifacts/issue12_q4_late_fg_diagnostic.json
            issue12-diagnostic.log
          if-no-files-found: ignore
          retention-days: 14
