name: Profile frozen Q4 runtime memory (research only)

# Diagnostic only. Runs when added/edited and on explicit dispatch.
# Does not load future NFL outcomes or change the hosted recommendation.
on:
  push:
    branches: [main]
    paths:
      - scripts/profile_q4_runtime_resources.py
      - .github/workflows/hosted_q4_resource_profile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production dependencies
        run: python -m pip install -r requirements.txt

      - name: Measure model load and Q4 HOME/AWAY memory
        run: |
          PYTHONPATH=. python scripts/profile_q4_runtime_resources.py \
            | tee hosted-q4-resource-profile.txt

      - name: Retain read-only resource profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-q4-resource-profile
          path: hosted-q4-resource-profile.txt
          if-no-files-found: ignore
          retention-days: 14
