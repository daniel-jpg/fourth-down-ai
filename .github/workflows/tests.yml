name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Syntax-check deployed Streamlit app and kickoff modules
        run: |
          python -m py_compile app.py
          python -m py_compile src/streamlit_kickoff_preview.py
          python -m py_compile src/kickoff_2025_resolved.py
          python -m py_compile src/kickoff_2025_onside_sensitivity.py

      - name: Run regression tests
        run: |
          python -m pytest -v
