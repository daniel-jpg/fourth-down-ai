name: Audit post-made-field-goal Q4 continuation

on:
  push:
    branches: [main]
    paths:
      - "src/72_audit_post_made_fg_wp.py"
      - "tests/test_post_made_fg_wp.py"
      - ".github/workflows/audit_post_made_fg_wp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-score-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate real-score matching and kickoff transitions
        run: python -m pytest -q tests/test_post_made_fg_wp.py
      - name: Audit actual field goals and exact continuation
        run: |
          set -o pipefail
          python src/72_audit_post_made_fg_wp.py 2>&1 | tee post-made-fg-wp-audit.log
      - name: Save observational report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-made-fg-wp-audit-no-production-changes
          path: |
            post-made-fg-wp-audit.log
            artifacts/72_post_made_fg_wp_attribution.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verify official model and app were untouched
        run: |
          git diff --exit-code -- models/win_probability_model.joblib
          git diff --exit-code -- src/42_build_decision_engine.py
          git diff --exit-code -- app.py
