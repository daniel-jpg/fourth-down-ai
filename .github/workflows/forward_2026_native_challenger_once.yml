name: Frozen 2026 native kickoff challenger (post-gate once)

# Runs AFTER the original one-time prospective 2026 Step 66 workflow
# has completed, never before. This does not modify the Step 66 protocol.
# "completed" also fires on weekly NOT READY checks, so the job verifies
# the committed final Step 66 report BEFORE downloading 2026 play-by-play.
# No manual dispatch and no scheduled independent access to future games.
on:
  workflow_run:
    workflows:
      - "Frozen 2026 kickoff validation (automatic, once)"
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: frozen-2026-native-challenger-once
  cancel-in-progress: false

jobs:
  native-input-reliability:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Read published main and frozen prospective gate
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Do not evaluate until original Step 66 one-time result is committed
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if test -f reports/2026_native_kickoff_challenger_final.json; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "The native challenger was already evaluated ONCE. Skipping."
          elif test -f reports/2026_forward_kickoff_wp_final.txt \
            && grep -q '^PREDECLARED RESEARCH DECISION:' reports/2026_forward_kickoff_wp_final.txt \
            && grep -q '^evaluation_commit=' reports/2026_forward_kickoff_wp_final.txt \
            && ! grep -q '^NOT READY:' reports/2026_forward_kickoff_wp_final.txt; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Frozen Step 66 report exists; companion may run one time."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Original 100-game prospective gate has NOT completed."
            echo "No 2026 scores, metadata, or reliability measurements requested."
          fi

      - name: Verify companion code has not been changed since registration
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object src/83_forward_2026_native_challenger_once.py)"
          expected="90ea87140de3aa3bd442bc5546cb549bdea6f0cf"
          if test "$actual" != "$expected"; then
            echo "Registered Step 83 source blob changed. Refuse future-data access."
            exit 1
          fi
          echo "Frozen native challenger source hash verified."

      - name: Setup Python
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned project dependencies
        if: steps.gate.outputs.ready == 'true'
        run: python -m pip install -r requirements-dev.txt

      - name: Test challenger solely with synthetic fixtures
        if: steps.gate.outputs.ready == 'true'
        run: |
          python -m pytest -q \
            tests/test_forward_2026_native_challenger.py \
            tests/test_wp_forward_2026.py
          python -m py_compile src/83_forward_2026_native_challenger_once.py

      - name: Score native vs synthetic kickoff only after original gate
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python src/83_forward_2026_native_challenger_once.py 2>&1 \
            | tee native-2026-once.log

      - name: Validate once-only summary, site breakdown, and no model promotion
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("reports/2026_native_kickoff_challenger_final.json").read_text())
          assert report["report_name"]=="PRECOMMITTED_2026_NATIVE_INPUT_CHALLENGER_ONCE"
          assert report["evaluation_year"]==2026
          assert report["first_week"]==6 and report["last_week"]==18
          assert report["eligible_only_after_original_step66_one_time_report"]
          assert not report["retrained_wp_or_candidate_parameters"]
          assert not report["nonordinary_scoring_returns_included"]
          assert report["whole_game_bootstrap_draws"]==2000
          assert report["production_action"]=="KEEP FROZEN — NO AUTOMATIC PROMOTION"
          findings=report["metrics"]
          assert findings["sample_games"]>=100
          assert findings["sample_kickoffs"]>=findings["sample_games"]
          for label in ("overall","kicker_home","kicker_away",
                        "last_five_gt40","q4_5_to_15_minutes"):
              assert label in findings["paired_results"]
          assert findings["research_screen"]["promotion_to_production_authorized"] is False
          PY
          git diff --exit-code -- models/win_probability_model.joblib
          git diff --exit-code -- src/42_build_decision_engine.py
          git diff --exit-code -- app.py

      - name: Commit challenger report ONCE, never model code
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/2026_native_kickoff_challenger_final.json
          git diff --cached --check
          git commit -m "Record frozen 2026 native kickoff challenger validation once"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Prospective native challenger completed one time."
          echo "No production promotion. Review all model/site uncertainty."

      - name: Preserve log of one-time research execution
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frozen-2026-native-challenger-post-gate
          path: native-2026-once.log
          if-no-files-found: warn
          retention-days: 30
