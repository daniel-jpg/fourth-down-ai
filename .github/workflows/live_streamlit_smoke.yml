name: Live Streamlit browser smoke (one-time/manual)

# This runs when first added (or deliberately edited) and can also be
# dispatched manually. It never blocks the regular offline regression suite.
on:
  push:
    paths:
      - .github/workflows/live_streamlit_smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Exercise public Streamlit app without changing model state
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          url = "https://fourth-down-ai.streamlit.app/"

          def find_app_frame(page, seconds=80):
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  for frame in page.frames:
                      try:
                          if frame.get_by_text("Game Situation", exact=True).count():
                              return frame
                      except Exception:
                          pass
                  page.wait_for_timeout(1000)
              print(
                  "Frame URLs at timeout:",
                  [(frame.name, frame.url) for frame in page.frames],
                  flush=True,
              )
              for frame in page.frames:
                  try:
                      print(
                          "Frame text excerpt:", frame.url,
                          frame.locator("body").inner_text(timeout=3000)[:650],
                          flush=True,
                      )
                  except Exception as exc:
                      print("Frame text unavailable:", str(exc)[:150], flush=True)
              return None

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={"width": 1440, "height": 900},
                  device_scale_factor=1,
              )
              try:
                  app = None
                  for attempt in range(2):
                      page.goto(url, wait_until="domcontentloaded", timeout=60000)
                      app = find_app_frame(page)
                      if app:
                          break
                      print(f"Retrying live page load {attempt+1}", flush=True)
                  assert app is not None, "Live app was not found in any browser frame"
                  print("Found live app frame:", app.url, flush=True)

                  assert app.get_by_text("Build info", exact=True).count() == 0
                  app.get_by_text("2025 kickoff comparison", exact=True).click()
                  option = app.get_by_role(
                      "checkbox",
                      name="Show the experimental kickoff-adjusted comparison",
                  )
                  assert not option.is_checked(), "Scenario should be opt-in"
                  # Streamlit's React-Aria label overlays the native input.
                  # Click the visible text a real user would click, rather
                  # than Playwright's input.check() (which the label intercepts).
                  app.get_by_text(
                      "Show the experimental kickoff-adjusted comparison",
                      exact=True,
                  ).click()
                  app.get_by_role(
                      "checkbox",
                      name="Show the experimental kickoff-adjusted comparison",
                  ).wait_for(timeout=30000)
                  assert app.get_by_role(
                      "checkbox",
                      name="Show the experimental kickoff-adjusted comparison",
                  ).is_checked(), "Visible checkbox label did not enable scenario"
                  app.get_by_role("button", name="Analyze Fourth Down").click()
                  app.get_by_text("Decision", exact=True).first.wait_for(
                      timeout=120000
                  )
                  app.get_by_text(
                      "2025 kickoff scenario results", exact=True
                  ).first.wait_for(timeout=240000)
                  assert app.get_by_text("Recommendation", exact=True).count() > 0
                  assert app.get_by_text(
                      "Experimental strategy (not official)", exact=True
                  ).count() > 0
                  assert app.get_by_text(
                      "optional kickoff scenario was unavailable", exact=False
                  ).count() == 0
                  print(
                      "LIVE PASS: official decision and optional observed-2025 "
                      "kickoff comparison both rendered in the hosted app.",
                      flush=True,
                  )
              finally:
                  try:
                      page.screenshot(path="live-streamlit-smoke.png", full_page=True)
                  except Exception as exc:
                      print(f"Screenshot unavailable: {exc}", flush=True)
                  browser.close()
          PY

      - name: Attach live browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-streamlit-smoke
          path: live-streamlit-smoke.png
          if-no-files-found: ignore
          retention-days: 7
