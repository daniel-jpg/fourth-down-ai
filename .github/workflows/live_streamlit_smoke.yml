name: Live Streamlit browser smoke (corrected Q4 demo)

# This runs when first added (or deliberately edited) and can also be
# dispatched manually. It never blocks the regular offline regression suite.
# Critical hosted regression: Q4 corrections reuse cached heavy model files
# through an isolated per-request function namespace instead of reloading
# a second full model + parquet data bundle into Streamlit Cloud memory.
# Recheck the hosted Q4 decision after the display-only deep-own-territory
# GO support warning (that warning is covered by headless AppTest).
# Re-run the actual hosted Q4 warning after caching the FG-input
# sensitivity probe alongside completed results on Streamlit reruns.
# Current deployment QA ALSO checks opt-in temperature/wind/conditions,
# the manual METAR viewer and distinct international stadium lookup.
# Research metadata must never automatically alter official recommendations.
# Verify the real public app when deployed source/dependencies change, and
# twice weekly even if no one manually checks the hosted page. A green local
# test suite alone cannot prove Streamlit Cloud is synchronized with main.
on:
  push:
    branches:
      - main
    paths:
      - app.py
      - src/**
      - requirements.txt
      - requirements-dev.txt
      - .github/workflows/live_streamlit_smoke.yml
  schedule:
    - cron: "17 19 * * 1,4"  # Monday/Thursday at 19:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# Rapid successive source commits should only leave the newest hosted check
# running. A failed scheduled check is diagnostic, not a model release gate.
concurrency:
  group: live-streamlit-smoke-public-demo
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested main revision
        uses: actions/checkout@v4

      - name: Calculate expected runtime source fingerprint
        id: expected
        run: echo "fingerprint=$(python -m src.deployment_source_fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Exercise public Streamlit app without changing model state
        env:
          EXPECTED_SOURCE_FINGERPRINT: ${{ steps.expected.outputs.fingerprint }}
        run: |
          python - <<'PY'
          import os
          import time
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          url = "https://fourth-down-ai.streamlit.app/"
          expected_source_fingerprint = os.environ["EXPECTED_SOURCE_FINGERPRINT"]
          assert len(expected_source_fingerprint) == 64, "Invalid expected fingerprint"

          def find_app_frame(page, seconds=80):
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  for frame in page.frames:
                      try:
                          if frame.get_by_text("Game Situation", exact=True).count():
                              return frame
                      except Exception:
                          pass
                  page.wait_for_timeout(1000)
              print(
                  "Frame URLs at timeout:",
                  [(frame.name, frame.url) for frame in page.frames],
                  flush=True,
              )
              for frame in page.frames:
                  try:
                      print(
                          "Frame text excerpt:", frame.url,
                          frame.locator("body").inner_text(timeout=3000)[:650],
                          flush=True,
                      )
                  except Exception as exc:
                      print("Frame text unavailable:", str(exc)[:150], flush=True)
              return None

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={"width": 1440, "height": 900},
                  device_scale_factor=1,
              )
              try:
                  app = None
                  for attempt in range(2):
                      page.goto(url, wait_until="domcontentloaded", timeout=60000)
                      app = find_app_frame(page)
                      if app:
                          break
                      print(f"Retrying live page load {attempt+1}", flush=True)
                  assert app is not None, "Live app was not found in any browser frame"
                  print("Found live app frame:", app.url, flush=True)

                  # Allow Streamlit Cloud to catch up with main's deployment.
                  deadline = time.monotonic() + 240
                  while time.monotonic() < deadline:
                      if (
                          app.get_by_text("2025 kickoff comparison", exact=True).count() == 0
                          and app.get_by_text("Build info", exact=True).count() == 0
                      ):
                          break
                      print("Waiting for removed kickoff panel to deploy", flush=True)
                      page.wait_for_timeout(8000)
                      page.reload(wait_until="domcontentloaded", timeout=60000)
                      app = find_app_frame(page, seconds=40)
                      assert app is not None, "Streamlit app frame missing after reload"
                  else:
                      raise AssertionError(
                          "Old kickoff panel still visible after deployment wait"
                      )
                  assert app.get_by_text(
                      "Show the experimental kickoff-adjusted comparison",
                      exact=True
                  ).count() == 0, "Removed scenario checkbox is still visible"

                  # A weather heading alone cannot prove a new version deployed.
                  # Compare a hidden hash of the actual hosted app.py, src/**/*.py,
                  # src/**/*.json, and pinned requirements against this checkout.
                  # This marker is invisible to users and changes no predictions.
                  deployment_deadline = time.monotonic() + 180
                  reloads = 0
                  while True:
                      marker = app.locator("#fourth-down-runtime-source")
                      hosted_fingerprint = (
                          marker.first.get_attribute("data-source-sha256")
                          if marker.count() == 1 else None
                      )
                      weather_heading_present = app.get_by_text(
                          "Weather observations (optional)", exact=True
                      ).count() > 0
                      if (
                          hosted_fingerprint == expected_source_fingerprint
                          and weather_heading_present
                      ):
                          break
                      body = app.locator("body").inner_text(timeout=10000)
                      print(
                          "HOSTED SOURCE BEHIND EXPECTED GITHUB MAIN? ",
                          {
                              "reloads": reloads,
                              "source_marker_present":
                                  hosted_fingerprint is not None,
                              "source_matches_main":
                                  hosted_fingerprint == expected_source_fingerprint,
                              "expected_prefix": expected_source_fingerprint[:12],
                              "hosted_prefix": (
                                  hosted_fingerprint[:12]
                                  if hosted_fingerprint else None
                              ),
                              "weather_heading_present": weather_heading_present,
                              "model_analyze_present":
                                  "Analyze Fourth Down" in body,
                              "visible_form_tail":
                                  body.split("Game site")[-1][:550],
                          },
                          flush=True,
                      )
                      if time.monotonic() > deployment_deadline:
                          raise AssertionError(
                              "HOSTED_DEPLOYMENT_NOT_SYNCED_WITH_MAIN: "
                              "The public Streamlit app lacks the expected "
                              "source fingerprint or weather UI. Check the "
                              "Streamlit Cloud repository/branch/entrypoint, "
                              "review deployment logs and reboot the app. "
                              "Do not claim that the latest main code is live."
                          )
                      page.wait_for_timeout(12000)
                      page.reload(wait_until="domcontentloaded", timeout=60000)
                      app = find_app_frame(page, seconds=65)
                      assert app is not None, "Cloud app unavailable after reload"
                      reloads += 1
                  print(
                      "LIVE PASS: hosted code/dependency source fingerprint "
                      "matches the tested main checkout and the weather UI "
                      f"is present, after {reloads} reload(s)",
                      flush=True,
                  )

                  # The Q4 HOME default state is known to be sensitive
                  # to the old synthetic kickoff representation. Select
                  # HOME before analyzing so Streamlit can finish its rerun.
                  app.get_by_text("Home", exact=True).first.click()
                  page.wait_for_timeout(3500)
                  app.get_by_role(
                      "button", name="Analyze Fourth Down"
                  ).click()
                  print("Clicked Analyze Fourth Down for Q4 HOME", flush=True)

                  # App now saves completed analyses in session_state
                  # across reruns, and invalidates when input changes.
                  # Require the FULL result in two consecutive snapshots
                  # so the hosted check catches regressions in persistence.
                  required = (
                      "Decision",
                      "Recommendation",
                      "Win probability if chosen",
                      "Close call",
                      "Q4 estimates use corrected standard-35 kickoff inputs",
                  )
                  forbidden = (
                      "INCONCLUSIVE",
                      "Frozen-model FG WP",
                      "Model reliability warning",
                      "2025 kickoff scenario results",
                      "Show the experimental kickoff-adjusted comparison",
                  )
                  consecutive = 0
                  deadline = time.monotonic() + 220
                  last_content = ""
                  last_report = 0
                  while time.monotonic() < deadline:
                      try:
                          last_content = app.locator("body").inner_text(
                              timeout=12000
                          )
                      except Exception as exc:
                          print("Transient body read:", str(exc)[:180], flush=True)
                          consecutive = 0
                          page.wait_for_timeout(1500)
                          continue
                      if "Older percentages have NOT been silently substituted" in last_content:
                          raise AssertionError(
                              "Q4 corrected calculation failed on hosted app: "
                              + last_content[-800:]
                          )
                      now = time.monotonic()
                      if now - last_report > 25:
                          last_report = now
                          print(
                              "Q4 progress",
                              {
                                  "required": {
                                      phrase: phrase in last_content
                                      for phrase in required
                                  },
                                  "tail": last_content[-350:],
                              },
                              flush=True,
                          )
                      if all(phrase in last_content for phrase in required):
                          consecutive += 1
                          if consecutive >= 2:
                              break
                      else:
                          consecutive = 0
                      page.wait_for_timeout(1500)
                  else:
                      print(
                          "Live Q4 body at timeout:",
                          repr(last_content[-1600:]),
                          flush=True,
                      )
                      raise AssertionError(
                          "Hosted Q4 analysis never completed a stable "
                          "Recommendation + WP + Close call result"
                      )
                  assert all(
                      phrase not in last_content for phrase in forbidden
                  ), "The hosted Q4 result contains a removed control or old text"
                  print(
                      "LIVE PASS: updated Q4 action estimates, normal "
                      "Recommendation, and Close call are rendered "
                      "together without the experimental checkbox.",
                      flush=True,
                  )

                  # Verify NEW weather controls against the real hosted
                  # Streamlit application, not just the AppTest harness.
                  # This only interacts with descriptive research inputs
                  # and does NOT click Analyze again or call weather APIs.
                  print("Opening hosted weather controls", flush=True)
                  app.get_by_text(
                      "Weather observations (optional)", exact=True
                  ).click(timeout=20000)
                  app.get_by_text(
                      "Enter observed temperature and wind", exact=True
                  ).wait_for(state="visible", timeout=45000)
                  app.get_by_text(
                      "Enter observed temperature and wind", exact=True
                  ).click(timeout=20000)
                  weather_labels = (
                      "Temperature (°F)", "Wind speed (mph)",
                      "Weather conditions",
                      "Wind direction relative to offense",
                      "Show 2026 stadium compass lookup (research only)",
                      "Inspect timestamped airport METAR evidence",
                  )
                  for item in weather_labels:
                      app.get_by_text(item, exact=True).first.wait_for(
                          state="visible", timeout=25000
                      )
                  print(
                      "LIVE PASS: temperature, wind speed, rain/snow context, "
                      "wind direction and source-evidence controls rendered",
                      flush=True,
                  )

                  app.get_by_text(
                      "Show 2026 stadium compass lookup (research only)",
                      exact=True,
                  ).click(timeout=25000)
                  app.get_by_text(
                      "2026 venue context", exact=True
                  ).wait_for(state="visible", timeout=25000)
                  app.get_by_text(
                      "Official 2026 international game", exact=True
                  ).first.click(timeout=25000)
                  app.get_by_text(
                      "2026 NFL international fixture", exact=True
                  ).wait_for(state="visible", timeout=25000)
                  assert app.get_by_text(
                      "2026 venue to inspect", exact=True
                  ).count() == 0, (
                      "International games must not silently show the "
                      "domestic home stadium selector"
                  )
                  print(
                      "LIVE PASS: venue context separates international "
                      "games from domestic stadium direction estimates",
                      flush=True,
                  )

                  # Explicitly check that changing descriptive weather UI
                  # did not resurrect the old kickoff checkbox or promote
                  # a weather-adjusted official action recommendation.
                  body = app.locator("body").inner_text(timeout=12000)
                  assert "Show the experimental kickoff-adjusted comparison" not in body
                  assert "Weather-adjusted field goal comparison (experimental)" not in (
                      body.split("Analyze Fourth Down")[0]
                  ), "Weather research what-if appeared as an official input"
                  print(
                      "LIVE PASS: current hosted Weather + 2026 stadium UI "
                      "has no unvalidated official weather policy controls",
                      flush=True,
                  )

              finally:
                  try:
                      page.screenshot(path="live-streamlit-smoke.png", full_page=True)
                  except Exception as exc:
                      print(f"Screenshot unavailable: {exc}", flush=True)
                  browser.close()
          PY

      - name: Attach live browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-streamlit-smoke
          path: live-streamlit-smoke.png
          if-no-files-found: ignore
          retention-days: 7
