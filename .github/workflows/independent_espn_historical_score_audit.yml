name: Historical ESPN independent final score audit (2014-2025)

# Historical scores ONLY. No 2026 reserved kickoff outcome retrieval,
# no 2027 prospective evaluation, no model fits or automatic model promotion.
on:
  push:
    branches: [main]
    paths:
      - "src/historical_scoreboard_verification.py"
      - "src/independent_espn_margin_archive.py"
      - "data/independent_espn_2014_2025_margin_archive.json"
      - "tests/test_independent_espn_margin_archive.py"
      - "tests/test_historical_scoreboard_verification.py"
      - "scripts/audit_independent_espn_historical_scores.py"
      - ".github/workflows/independent_espn_historical_score_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned developer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Synthetic ESPN payload and PBP mismatch fail-closed tests
        run: |
          PYTHONPATH=. python -m pytest -v tests/test_historical_scoreboard_verification.py tests/test_independent_espn_margin_archive.py
      - name: Replay entire 3151-game ESPN archive offline, no source requests
        run: |
          PYTHONPATH=. python -m src.independent_espn_margin_archive
      - name: Cross-check ALL 2014-2025 REG final game margins against ESPN
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/audit_independent_espn_historical_scores.py \
            --seasons 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 \
            --out artifacts/independent_espn_2014_2025_scores.json \
            2>&1 | tee independent-espn-2014-2025-audit.log
      - name: Save audit report, independent final score evidence, and retrieval log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-ESPN-2014-2025-final-score-audit
          path: |
            artifacts/independent_espn_2014_2025_scores.json
            artifacts/independent_espn_2014_2025_scores_espn_scores.json
            independent-espn-2014-2025-audit.log
          retention-days: 30
          if-no-files-found: ignore
