name: Refresh unpublished research-demo draft (one-time)

# One-time refresh of an existing DRAFT prerelease only.
# Never publishes a release, creates a stable tag, or promotes a model.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare_research_demo_draft.yml

permissions:
  contents: write
  actions: read

jobs:
  refresh-draft:
    if: github.repository == 'daniel-jpg/fourth-down-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: research-demo-2026-10-12
      CANDIDATE_SHA: 7414e7f60ea9cf2f4eafc26e86aadedb86408181
      LIVE_SHA: 053e4a5b7c16c88ef129fd39e6b780b8d965dda2
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check pinned CI, hosted smoke, and unchanged engine
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" HEAD

          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/38193570917" --jq '.head_sha')" = "$CANDIDATE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/38193570917" --jq '.conclusion')" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/38193289281" --jq '.head_sha')" = "$LIVE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/38193289281" --jq '.conclusion')" = "success"

          # Since the live no-panel smoke, changes must be source-level
          # tests or release docs only. The deployed app and model are
          # byte-for-byte the same across these two tested commits.
          while IFS= read -r changed; do
            case "$changed" in
              tests/test_kickoff_q4_reliability_guard.py|tests/test_native_kickoff_streamlit_preview.py|README.md|CHANGELOG.md|reports/88_research_demo_release_readiness.md|reports/90_release_candidate_checklist.md) ;;
              *) echo "Unexpected non-doc/test change: $changed" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$LIVE_SHA" "$CANDIDATE_SHA")

          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.0" --jq '.tag_name')" = "v1.1.0"
          echo "Gates passed. Candidate $CANDIDATE_SHA preserves live-tested app."

      - name: Prepare updated draft-only notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/draft-notes.md" <<'NOTES'
          # Fourth Down AI — research-demo snapshot (October 12, 2026)

          **Unpublished DRAFT prerelease. Not a stable model release.**
          [v1.1.0](https://github.com/daniel-jpg/fourth-down-ai/releases/tag/v1.1.0)
          remains the stable version and its frozen prediction engine is unchanged.

          **Pinned source:** 7414e7f60ea9cf2f4eafc26e86aadedb86408181

          ## Public app
          - Simple regulation/regular-season OT/playoff OT decision tool:
            official GO (pass/run), FIELD GOAL and PUNT estimated outcomes.
          - Explains immediate conversion, kick outcomes, Monte Carlo
            simulation noise, and modeled game WP or OT game value.
          - **No 2025 kickoff comparison section, toggle, or separate
            experimental strategy output in the public app.** All of these
            controls were removed following user review.
          - Unsupported fake punts and fake field goals are not ranked.
            The independent automatic Q4 model-reliability warning remains.

          ## Research retained separately
          - The repository preserves 538 verified 2025 Q4 nonscoring
            kickoff transitions and related 2024/2025 onside and native
            kickoff-input analyses. They are NOT live app features.
          - These retrospective estimates are not calibrated 2026+
            forecasts or evidence of a causal win-probability improvement.
          - The future Step 66/83 precommitted validation gates remain
            unchanged and are not permitted to run early or auto-promote models.

          ## Verification
          - [GitHub Actions Tests #234](https://github.com/daniel-jpg/fourth-down-ai/actions/runs/38193570917)
            passed on this pinned source, covering frozen artifacts,
            regression tests, and Streamlit AppTest.
          - [Hosted browser smoke #9](https://github.com/daniel-jpg/fourth-down-ai/actions/runs/38193289281)
            passed against the revised app source: no kickoff panel was
            visible, and the official fourth-down recommendation rendered.
            Commits since the live smoke touch only docs/tests, not app code.
          - Mobile layout was accepted by the project owner; QA issue #5 closed.

          ## Limits and provenance
          - Decisions and estimated edges are model-based, not causal
            coaching recommendations or independently validated 2026+
            performance. Monte Carlo SE is only simulation uncertainty.
          - Later 2025 exploratory research is no longer an untouched
            future holdout.
          - The hosted application's exact Git SHA was not independently
            attested; no unwanted public build-info panel was reintroduced.

          [Live demo](https://fourth-down-ai.streamlit.app/) ·
          [README](https://github.com/daniel-jpg/fourth-down-ai/blob/7414e7f60ea9cf2f4eafc26e86aadedb86408181/README.md) ·
          [Release checklist](https://github.com/daniel-jpg/fourth-down-ai/blob/7414e7f60ea9cf2f4eafc26e86aadedb86408181/reports/90_release_candidate_checklist.md)
          NOTES

      - name: Refresh existing draft without publishing
        shell: bash
        run: |
          set -euo pipefail
          # Draft tags are not necessarily resolvable via releases/tags.
          # Use the verified existing draft ID; still verify its tag.
          draft_id="410049269"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" --jq '.tag_name')" = "$TAG"
          old_target="$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" --jq '.target_commitish')"
          draft_status="$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" --jq '.draft')"
          test "$draft_status" = "true" || {
            echo "Refusing to alter a published release." >&2
            exit 1
          }
          case "$old_target" in
            9ca973c458b488225f4072679a57d1c0cddba367|"$CANDIDATE_SHA") ;;
            *) echo "Unexpected draft target; refusing to overwrite." >&2; exit 1 ;;
          esac
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$draft_id" \
            -f target_commitish="$CANDIDATE_SHA" \
            -f name="Fourth Down AI — Verified official-only research demo" \
            -f "body=$(cat "$RUNNER_TEMP/draft-notes.md")" \
            -F draft=true \
            -F prerelease=true >/dev/null

          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" --jq '.draft')" = "true"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" --jq '.target_commitish')" = "$CANDIDATE_SHA"
          echo "Updated existing draft at $CANDIDATE_SHA. Nothing was published."
