name: 2027 same-source PBP reconstruction - pinned 2014-25 rehearsal only

# Uses ONLY the existing checked-in, SHA-gated 2014-2025 raw NFLverse
# archive. The 2027 fixture tests contain invented game IDs. No nflreadpy
# download, no 2026/2027 rows, no scheduled future holdout scoring, no
# protected Steps 66/83 invocation, no model writes or public app changes.
on:
  push:
    branches: [main]
    paths:
      - "src/nflverse_2027_reconstruction.py"
      - "tests/test_nflverse_2027_reconstruction.py"
      - ".github/workflows/2027_nflverse_historical_reconstruction_rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Prove label-free fourth-down census and locked season gates
        run: |
          PYTHONPATH=. python -m pytest -v tests/test_nflverse_2027_reconstruction.py
      - name: Rehearse on ORIGINAL pinned 2014-2025 raw nflverse PBP
        run: |
          set -o pipefail
          PYTHONPATH=. python -m src.nflverse_2027_reconstruction --historical-audit-only | tee same-source-historical-census.json
      - name: Reject false prospective or pre-snap certification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("same-source-historical-census.json").read_text())
          assert obj["source"] == "PINNED_2014_2025_NFLVERSE_RAW_PBP_ONLY"
          assert obj["source_blob_sha1"] == "41ae23de12913f0bf06ac608ad4716ae48d75df8"
          # Measured from the original SHA-pinned 2014-2025 PBP on CI
          # run 38283359016. Freeze exact counts to detect future drift.
          assert obj["source_fourth_down_candidates"] == 50095
          assert obj["reconstructed_core_states"] == 47625
          assert obj["excluded_states"] == 2470
          assert obj["exclusion_counts"] == {
              "IMPOSSIBLE_YARDS_TO_GO": 1,
              "NOT_REGULAR_SEASON": 2153,
              "OVERTIME": 316,
          }
          assert obj["context_fields_present"] == 34424
          assert obj["missing_model_context_counts"] == {
              "Q2_SECOND_HALF_RECEIVER_UNAVAILABLE": 13201
          }
          assert obj["source_labels_accessed"] is False
          assert obj["preplay_independently_timestamped"] is False
          assert obj["real_2027_outcomes_accessed"] is False
          assert obj["frozen_policy_commit"] == "31176d50af25db9dd42dae07e9b17cb5c2b930b4"
          print("PASS: historical-only, complete in-source denominator, labels isolated")
          PY
      - name: Confirm original app, sources, models and protected gate unchanged
        run: |
          git diff --exit-code -- app.py data models src/66_forward_2026_continuation_wp.py src/83_forward_2026_native_challenger_once.py
      - name: Archive only historical aggregate, never outcomes or raw plays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: same-source-nflverse-2014-2025-census-only
          path: same-source-historical-census.json
          retention-days: 21
          if-no-files-found: ignore
