name: Evaluate fixed Q4 decision robustness grid

on:
  push:
    branches: [main]
    paths:
      - "src/78_audit_q4_strategy_stability.py"
      - "tests/test_q4_strategy_stability.py"
      - ".github/workflows/evaluate_q4_strategy_stability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q4-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out frozen public model and historical donors
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check fixed grid, GO/FIELD GOAL aggregation and uncertainty
        run: |
          python -m pytest -q tests/test_q4_strategy_stability.py tests/test_streamlit_kickoff_preview.py

      - name: Evaluate frozen 14-state Q4 strategy grid
        run: |
          set -o pipefail
          python src/78_audit_q4_strategy_stability.py 2>&1 | tee q4-strategy-grid.log

      - name: Verify research-only report integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("artifacts/78_q4_fourth_down_local_strategy_grid.json").read_text())
          assert len(data["scenarios"])==14
          assert data["2026_outcomes_used"] is False
          assert data["frozen_production_engine"]
          assert data["experimental_only"]
          assert data["not_causal_policy_validation"]
          assert data["summary"]["prespecified_states"]==14
          assert data["summary"]["paired_supported"]>0
          assert data["simulations_per_action"]==1200
          assert not any(x["name"]=="2026" for x in data["scenarios"])
          PY
          git diff --exit-code -- models/win_probability_model.joblib
          git diff --exit-code -- src/42_build_decision_engine.py
          git diff --exit-code -- app.py

      - name: Archive fixed-grid results and calculation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-only-2025-kickoff-local-q4-grid
          path: |
            artifacts/78_q4_fourth_down_local_strategy_grid.json
            q4-strategy-grid.log
          if-no-files-found: warn
          retention-days: 30
