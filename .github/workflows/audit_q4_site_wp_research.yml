name: Historical Q4 site WP reliability audit

# Read-only 2023-24 REG PBP. 2025+ and once-only prospective gates forbidden.
on:
  push:
    branches: [main]
    paths:
      - src/q4_site_wp_research.py
      - scripts/audit_q4_site_wp_2023_2024.py
      - tests/test_q4_site_wp_research.py
      - .github/workflows/audit_q4_site_wp_research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-wp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install existing pinned development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Verify frozen contract and synthetic site-axis tests
        run: python -m pytest -v tests/test_q4_site_wp_research.py
      - name: Audit site WP on 2023-2024 REG development only
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/audit_q4_site_wp_2023_2024.py | tee q4-site-wp-audit.txt
      - name: Preserve descriptive audit, no model artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q4-site-wp-2023-2024-development
          path: |
            q4-site-wp-audit.txt
            artifacts/q4_site_wp_2023_2024_development.json
          retention-days: 21
          if-no-files-found: ignore
