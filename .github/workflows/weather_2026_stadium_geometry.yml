name: 2026 NFL stadium compass geometry and NOAA research smoke

# Existing frozen official model remains unchanged. Venues are 2026 ONLY.
# All football/play data and NOAA responses in this CI are SYNTHETIC.
# No LIVE NOAA fetch, no real 2026 protected NFL outcomes, no 2027 venue.
on:
  push:
    branches: [main]
    paths:
      - src/stadium_weather_2026_reference.json
      - src/nfl_stadium_weather_geometry.py
      - scripts/capture_nfl_venue_awc_context.py
      - tests/test_nfl_stadium_weather_geometry.py
      - tests/test_streamlit_app_integration.py
      - app.py
      - .github/workflows/weather_2026_stadium_geometry.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stadium-bearing-explicit-no-model-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Check 2026 registry and headless Streamlit model separation
        run: |
          python -m py_compile \
            src/nfl_stadium_weather_geometry.py \
            scripts/capture_nfl_venue_awc_context.py \
            app.py
          PYTHONPATH=. python -m pytest -q \
            tests/test_nfl_stadium_weather_geometry.py \
            tests/test_streamlit_app_integration.py
      - name: Fabricated SEA stadium / KBFI airport receipt without NFL or NOAA traffic
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          fake=[{
              "icaoId":"KBFI",
              "obsTime":int(datetime(2026,10,12,18,0,tzinfo=timezone.utc).timestamp()),
              "receiptTime":"2026-10-12T18:04:00Z",
              "lat":47.53,"lon":-122.302,"wdir":90,"wspd":12,
              "rawOb":"METAR KBFI 121800Z 09012KT 10SM -RA BKN015 12/08 A2996 RMK AO2",
          }]
          Path("artifacts/FICTIONAL_KBFI_WEATHER.json").write_text(
              json.dumps(fake,sort_keys=True)
          )
          PY
          PYTHONPATH=. python -m scripts.capture_nfl_venue_awc_context \
            --source-json artifacts/FICTIONAL_KBFI_WEATHER.json \
            --captured-utc 2026-10-12T18:45:00Z \
            --venue-team SEA --season 2026 --attack-end A \
            --station KBFI --decision-utc 2026-10-12T18:35:00Z \
            --roof outdoors \
            --out artifacts/FICTIONAL_SEATTLE_RESEARCH_WEATHER.json
      - name: Assert compass geometry remains unsigned and never changes policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("artifacts/FICTIONAL_SEATTLE_RESEARCH_WEATHER.json").read_text())
          g=x["venue_geometry"]
          assert g["team_venue_reference"]=="SEA"
          assert g["stadium_name"]=="Lumen Field"
          assert g["season"]==2026
          assert g["offense_attack_heading_true_deg_approx"] == 0
          assert g["stadium_coordinates_independently_verified"] is False
          assert g["field_axis_orientation_independently_surveyed"] is False
          assert g["offense_attack_heading_user_confirmed_at_snap"] is False
          assert g["can_change_official_fourth_down_recommendation"] is False
          assert x["station_distance_km"]<10
          assert x["source_downloaded_after_decision"] is True
          assert x["snap_specific_weather_verified"] is False
          assert x["actual_game_at_this_venue_verified"] is False
          assert x["official_model_unchanged"] is True
          assert x["provider_origin_https_verified_for_this_capture"] is False
          assert x["real_2027_outcomes_accessed"] is False
          assert x["airport_present_weather_code"]=="AIRPORT_RAIN_REPORTED"
          print("PASS: community geometry + fabricated airport wind; no verified game/weather claims")
          PY
      - name: Never overwrite synthetic receipt
        shell: bash
        run: |
          if PYTHONPATH=. python -m scripts.capture_nfl_venue_awc_context \
             --source-json artifacts/FICTIONAL_KBFI_WEATHER.json \
             --captured-utc 2026-10-12T18:45:00Z \
             --venue-team SEA --season 2026 --attack-end A \
             --station KBFI --decision-utc 2026-10-12T18:35:00Z \
             --roof outdoors \
             --out artifacts/FICTIONAL_SEATTLE_RESEARCH_WEATHER.json \
             >second.log 2>&1; then
             echo "ERROR: second weather receipt overwritten" && exit 1
          fi
          grep -q "Never overwrite" second.log
      - name: Ensure production model artifacts and 2026 reserved gates untouched
        run: |
          git diff --exit-code -- models data \
            src/42_build_decision_engine.py \
            src/66_forward_2026_continuation_wp.py \
            src/83_forward_2026_native_challenger_once.py
      - name: Archive fabricated 2026 stadium-weather geometry only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-2026-venue-station-wind-context
          path: artifacts/FICTIONAL_SEATTLE_RESEARCH_WEATHER.json
          if-no-files-found: ignore
          retention-days: 14
